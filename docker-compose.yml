version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: taskdb-mysql
    environment:
      MYSQL_DATABASE: taskdb
      MYSQL_ROOT_PASSWORD: naveen9950
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
    networks:
      - task-network

  app:
    build: .
    container_name: task-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/taskdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: naveen9950
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      - task-network

volumes:
  mysql-data:

networks:
  task-network:
    driver: bridge